name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No pip cache: this project is intentionally stdlib-only (no
      # requirements.txt / pyproject.toml), so `cache: pip` would fail.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check all scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin manifest and skills
        run: python scripts/check_plugin.py .

      - name: Bootstrap smoke test (installs into a temp skill dir)
        run: python scripts/bootstrap.py --skill-dir "$RUNNER_TEMP/codex-skills"
