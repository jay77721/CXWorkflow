name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin manifest and skills
        run: python scripts/check_plugin.py .

      - name: Verify one-click prompts keep protocol fields
        run: python -m unittest tests.test_prompts -v
